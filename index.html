
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SetCifra — Modo Palco</title>
<style>
:root{--bg:#0b0b0d;--panel:#151519;--panel2:#1e1e24;--text:#f4f4f5;--muted:#9ca3af;--accent:#facc15;--danger:#ef4444;--border:#2b2b32;--fs:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:900;font-size:24px}.brand span{color:var(--accent)}
.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.btn:hover{border-color:#555}.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}.danger{color:#fecaca;border-color:#7f1d1d}
.btn:disabled{opacity:.3;cursor:default}.btn:disabled:hover{border-color:var(--border)}.btn.primary:disabled:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{width:100%;padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--panel);color:white;font-size:18px;outline:none}.search:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}.card h2{margin:0 0 12px;font-size:17px}.song{padding:12px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer}.song:hover{border-color:var(--accent)}.song small{color:var(--muted)}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:16px}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--border);background:#0e0e11;color:white}.field textarea{min-height:320px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}

/* ===== MODO PALCO (paginado, sem rolagem) ===== */
.stage{position:fixed;inset:0;background:#050505;z-index:20;overflow:hidden;display:flex;flex-direction:column}
.stageHeader{flex:0 0 auto;background:#050505;border-bottom:1px solid #222;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stageTitle{min-width:0;display:flex;align-items:baseline;gap:10px}.stageTitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}.stageTitle small{color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stageHeader .btn{padding:6px 11px}
.stageBody{flex:1 1 auto;min-height:0;overflow:hidden;width:100%;padding:10px 22px 6px}
.chordSheet.measuring{display:inline-block;white-space:pre;width:auto}
.chordSheet.paged{display:grid;justify-content:center;align-items:start}
.pageCol{position:relative;min-width:0}
.pageCol+.pageCol::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--gap,32px) / -2);width:1px;background:#262626}
.pageCol:empty::before{display:none}
.chordSheet{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:var(--fs);line-height:1.25;white-space:pre-wrap;word-break:normal;margin:0;padding:0}
.chordLine{color:var(--accent);font-weight:800;min-height:1em}.lyricLine{color:#fff;min-height:1em}.plainLine{color:#ddd;min-height:1em}
.chordSheet.turn{animation:pageTurn .14s ease-out}
@keyframes pageTurn{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.chordSheet.turn{animation:none}}
.controls{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;background:#0e0e11;border-top:1px solid #262626;padding:6px 10px;transition:opacity .25s}
.controls.fade{opacity:.18}.controls:hover,.controls:focus-within{opacity:1}
.controls .btn{padding:6px 9px;font-size:13px}
.navGroup{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls .pageBtn{padding:7px 15px;font-size:15px;font-weight:800}
.pageInfo{min-width:64px;text-align:center;font-weight:900;color:var(--accent);font-size:17px;font-variant-numeric:tabular-nums}
.fontInfo{min-width:40px;text-align:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sep{width:1px;height:24px;background:#333;margin:0 2px}
.pagePill{color:var(--accent);border:1px solid #4a4214;padding:4px 10px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}

.pill{color:#111;background:var(--accent);padding:6px 10px;border-radius:999px;font-weight:900}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}
.setlistItem{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:9px 0}.setlistItem:last-child{border:0}
@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.app{padding:12px}.stageBody{padding:8px 10px 4px}.chordSheet{font-size:var(--fs)}.stageHeader{flex-wrap:wrap}.sep{display:none}}
</style>
</head>
<body>
<div class="app" id="home">
  <div class="top">
    <div><div class="brand">Set<span>Cifra</span></div><div class="muted">Seu repertório de palco</div></div>
    <div class="actions">
      <button class="btn" onclick="exportBackup()">Exportar</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">Importar</button>
      <input id="importFile" type="file" accept=".json" class="hidden" onchange="importBackup(event)">
      <button class="btn primary" onclick="openEditor()">+ Colar cifra</button>
    </div>
  </div>
  <input id="search" class="search" placeholder="Buscar música ou artista..." oninput="render()">
  <div class="grid">
    <section class="card"><h2>Biblioteca</h2><div id="songs"></div></section>
    <section class="card">
      <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Repertório do show</h2><button class="btn" onclick="clearSetlist()">Limpar</button></div>
      <div id="setlist"></div>
      <div style="margin-top:12px"><button class="btn primary" onclick="startSetlist()">Abrir modo palco</button></div>
    </section>
  </div>
</div>


<div id="editor" class="modal hidden">
 <div class="modalbox">
  <div class="row" style="justify-content:space-between"><h2 id="editorTitle">Colar cifra</h2><button class="btn" onclick="closeEditor()">Fechar</button></div>
  <input type="hidden" id="songId">
  <div class="grid">
   <div class="field"><label>Música</label><input id="title"></div>
   <div class="field"><label>Artista</label><input id="artist"></div>
  </div>
  <div class="grid">
   <div class="field"><label>Tom original</label><select id="key"></select></div>
   <div class="field"><label>Duração (mm:ss)</label><input id="duration" placeholder="03:40"></div>
  </div>
  <div class="field">
<label>Cole a cifra exatamente como foi copiada do navegador</label>
<textarea id="content" placeholder="Ex.: **Tom: C**&#10;&#10;[Intro] **G9** **F** **G9** **F**&#10;&#10;**C9** **G** **F9**&#10;Trecho da letra..."></textarea>
<div class="row" style="margin-top:8px">
<button class="btn" type="button" onclick="processPastedChord()">Limpar e organizar</button>
<span id="processInfo" class="muted" style="align-self:center"></span>
</div>
</div>
  <div class="row"><button class="btn primary" onclick="saveSong()">Salvar música</button><button class="btn danger" id="deleteBtn" onclick="deleteCurrent()">Excluir</button></div>
 </div>
</div>

<div id="stage" class="stage hidden" onmousemove="wakeControls()" ontouchstart="wakeControls()">
 <div class="stageHeader">
  <div class="stageTitle"><b id="stageName"></b><small id="stageArtist"></small></div>
  <div class="row" style="align-items:center"><span id="stageCount" class="muted"></span><span id="pagePill" class="pagePill"></span><span id="keyPill" class="pill"></span><button class="btn" onclick="exitStage()">Sair</button></div>
 </div>
 <div class="stageBody" id="stageBody"><div id="sheet" class="chordSheet"></div></div>
 <div id="controls" class="controls">
  <div class="navGroup">
   <button class="btn" id="previousSongBtn" onclick="previousSong()" title="Música anterior (seta ←)">← Música</button>
   <button class="btn pageBtn" id="prevPageBtn" onclick="prevPage()" title="Página anterior (PageUp / seta ↑)">← Página</button>
   <span id="pageInfo" class="pageInfo" title="Página atual / total de páginas">1 / 1</span>
   <button class="btn pageBtn primary" id="nextPageBtn" onclick="nextPage()" title="Próxima página (PageDown / seta ↓)">Página →</button>
   <button class="btn" id="nextSongBtn" onclick="nextSong()" title="Próxima música (seta →)">Música →</button>
  </div>
  <span class="sep"></span>
  <div class="navGroup">
   <button class="btn" onclick="changeTranspose(-1)" title="Baixar meio tom (-)">Tom −</button>
   <button class="btn" onclick="resetTranspose()" title="Voltar ao tom original (0)">Original</button>
   <button class="btn" onclick="changeTranspose(1)" title="Subir meio tom (+)">Tom +</button>
   <button class="btn" onclick="chooseKey()" title="Digitar o tom desejado">Tom…</button>
  </div>
  <span class="sep"></span>
  <div class="navGroup">
   <button class="btn" onclick="fontSize(-1)" title="Diminuir fonte">A−</button>
   <span id="fontInfo" class="fontInfo">16px</span>
   <button class="btn" onclick="fontSize(1)" title="Aumentar fonte">A+</button>
   <button class="btn" onclick="fitFont()" title="Aumenta a fonte o máximo possível sem criar mais páginas">Ajustar</button>
   <button class="btn" id="colsBtn" onclick="cycleColumns()" title="Quantidade de colunas por página (C)">Col: Auto</button>
   <button class="btn" onclick="firstPage()" title="Voltar para a página 1 (R)">↺ Pág. 1</button>
   <button class="btn" onclick="fullscreen()" title="Tela cheia (F)">Tela cheia</button>
  </div>
 </div>
</div>

<script>
const NOTES_SHARP=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_INDEX={"C":0,"B#":0,"C#":1,"DB":1,"D":2,"D#":3,"EB":3,"E":4,"FB":4,"E#":5,"F":5,"F#":6,"GB":6,"G":7,"G#":8,"AB":8,"A":9,"A#":10,"BB":10,"B":11,"CB":11};
let db=JSON.parse(localStorage.getItem("setcifra-db")||'{"songs":[],"setlist":[],"prefs":{"font":18,"speed":0.65}}');
let current=null,currentSetIndex=-1,transpose=0,hideTimer=null;
// Paginação do Modo Palco
let pages=[],currentPage=0,repaginateTimer=null;
const FONT_MIN=12,FONT_MAX=48,FONT_DEFAULT=16;

function persist(){localStorage.setItem("setcifra-db",JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fillKeys(){key.innerHTML=NOTES_SHARP.map(n=>`<option>${n}</option>`).join("")} fillKeys();

function render(){
 const q=search.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const filtered=db.songs.filter(s=>(s.title+" "+s.artist).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q));
 songs.innerHTML=filtered.length?filtered.map(s=>`<div class="song" onclick="openStage('${s.id}')"><b>${esc(s.title)}</b><br><small>${esc(s.artist)} · Tom ${esc(s.key)}</small><div class="row" style="margin-top:8px"><button class="btn" onclick="event.stopPropagation();addSetlist('${s.id}')">+ Repertório</button><button class="btn" onclick="event.stopPropagation();openEditor('${s.id}')">Editar</button></div></div>`).join(""):`<div class="empty">Nenhuma música encontrada.</div>`;
 setlist.innerHTML=db.setlist.length?db.setlist.map((id,i)=>{let s=db.songs.find(x=>x.id===id);return s?`<div class="setlistItem"><span><b>${i+1}. ${esc(s.title)}</b><br><small class="muted">${esc(s.artist)}</small></span><span><button class="btn" onclick="moveItem(${i},-1)">↑</button> <button class="btn" onclick="moveItem(${i},1)">↓</button> <button class="btn" onclick="removeSet(${i})">×</button></span></div>`:""}).join(""):`<div class="empty">Adicione músicas ao repertório.</div>`;
}
function openEditor(id=""){
 let s=db.songs.find(x=>x.id===id);
 editor.classList.remove("hidden"); songId.value=s?.id||""; title.value=s?.title||""; artist.value=s?.artist||""; key.value=s?.key||"C"; duration.value=s?.duration||""; content.value=s?.content||""; editorTitle.textContent=s?"Editar música":"Colar cifra"; deleteBtn.classList.toggle("hidden",!s);
}
function closeEditor(){editor.classList.add("hidden")}
function saveSong(){
 if(!title.value.trim()||!content.value.trim())return alert("Informe o nome e a cifra/letra.");
 content.value=cleanPastedChord(content.value);
 const detectedKey=extractDeclaredKey(content.value);
 if(detectedKey) key.value=detectedKey;
 let id=songId.value||uid(), old=db.songs.find(x=>x.id===id);
 // scrollSpeed é mantido apenas por compatibilidade com backups antigos (não é mais usado no Modo Palco)
 let s={id,title:title.value.trim(),artist:artist.value.trim(),key:key.value,duration:duration.value.trim(),content:content.value,preferredTranspose:old?.preferredTranspose||0,scrollSpeed:old?.scrollSpeed??12,fontSize:old?.fontSize??FONT_DEFAULT};
 if(old)Object.assign(old,s);else db.songs.push(s);persist();closeEditor();render();
}
function deleteCurrent(){if(confirm("Excluir esta música?")){db.songs=db.songs.filter(s=>s.id!==songId.value);db.setlist=db.setlist.filter(id=>id!==songId.value);persist();closeEditor();render()}}
function addSetlist(id){db.setlist.push(id);persist();render()}
function removeSet(i){db.setlist.splice(i,1);persist();render()}
function moveItem(i,d){let j=i+d;if(j<0||j>=db.setlist.length)return;[db.setlist[i],db.setlist[j]]=[db.setlist[j],db.setlist[i]];persist();render()}
function clearSetlist(){if(confirm("Limpar repertório?")){db.setlist=[];persist();render()}}
function startSetlist(){
 if(!db.setlist.length)return alert("Adicione músicas ao repertório.");
 const first=db.setlist.findIndex(id=>db.songs.some(s=>s.id===id));
 if(first<0)return alert("As músicas do repertório não foram encontradas na biblioteca.");
 openStage(db.setlist[first]);
}

function isChordLine(line){
 let t=line.trim(); if(!t)return false;
 let tokens=t.split(/\s+/).filter(Boolean); if(!tokens.length)return false;
 let good=tokens.filter(x=>/^[A-G](#|b)?(?:m|maj|min|dim|aug|sus|add|M)?[0-9]*(?:\([^)]*\))?(?:[#b]?[0-9]+)*(?:\/[A-G](#|b)?)?$/.test(x)||["|",":","/","-"].includes(x));
 return good.length/tokens.length>=0.65;
}
function transposeNote(note,steps){
 let idx=NOTE_INDEX[note.toUpperCase()];if(idx===undefined)return note;
 return NOTES_SHARP[(idx+steps+120)%12];
}
function transposeChordToken(tok,steps){
 return tok.replace(/^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/,(_,root,middle,bass)=>transposeNote(root,steps)+middle+(bass?"/"+transposeNote(bass,steps):""));
}
function transposeLine(line,steps){
 return line.replace(/(?<![A-Za-z])([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add|M)?[0-9]*(?:\([^)]*\))?(?:[#b]?[0-9]+)*(?:\/[A-G](?:#|b)?)?)(?![A-Za-z])/g,m=>transposeChordToken(m,steps));
}

/* ================= PAGINAÇÃO ================= */

// Converte a música em linhas já transpostas e classificadas
function stageLines(){
 return String(current.content||"").split("\n").map((line,i)=>{
  const chord=isChordLine(line);
  const blank=!line.trim();
  return {i,text:chord?transposeLine(line,transpose):line,chord,blank,
   cls:chord?"chordLine":blank?"plainLine":"lyricLine",
   section:/^\s*\[[^\]]*\]/.test(line),h:0};
 });
}
function lineHtml(l){return `<div class="${l.cls}">${esc(l.text)||"&nbsp;"}</div>`}

// Agrupa linhas que não podem ser separadas entre páginas:
// - linha de acordes + linha de letra logo abaixo;
// - título de seção ([Refrão], [Verso]...) + o conteúdo que vem logo depois.
function buildUnits(lines){
 const units=[];
 for(let i=0;i<lines.length;i++){
  const l=lines[i],n=lines[i+1];
  if(l.blank){units.push({lines:[l],blank:true});continue}
  if(l.chord&&n&&!n.blank&&!n.chord){units.push({lines:[l,n]});i++;continue}
  units.push({lines:[l]});
 }
 const merged=[];
 for(let k=0;k<units.length;k++){
  const u=units[k],nx=units[k+1];
  const pureHeader=!u.blank&&u.lines.length===1&&u.lines[0].section&&!u.lines[0].chord;
  if(pureHeader&&nx&&!nx.blank){merged.push({lines:[...u.lines,...nx.lines],sectionStart:true});k++;continue}
  if(!u.blank&&u.lines[0].section)u.sectionStart=true;
  merged.push(u);
 }
 return merged;
}

// Área útil da página no palco
function stageMetrics(){
 const body=document.getElementById("stageBody");
 const cs=getComputedStyle(body);
 return {
  h:Math.max(40,body.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2),
  w:Math.max(100,body.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2)
 };
}
// Renderiza as linhas temporariamente só para medir (width 0 = sem quebra de linha)
function renderMeasure(lines,width){
 sheet.className=width?"chordSheet":"chordSheet measuring";
 sheet.style.width=width?width+"px":"";
 sheet.style.gridTemplateColumns="";
 sheet.innerHTML=lines.map(lineHtml).join("");
}
function measureHeights(all,units){
 const els=sheet.children;
 all.forEach((l,idx)=>{l.h=els[idx]?els[idx].getBoundingClientRect().height:0});
 units.forEach(u=>{u.h=u.lines.reduce((t,l)=>t+l.h,0)});
}

// Distribui os blocos em colunas da altura da tela, preferindo quebrar no fim de estrofes/seções
function packColumns(units,avail){
 const sum=a=>a.reduce((t,x)=>t+x.h,0);
 const result=[];
 const pushCol=p=>{p=p.slice();while(p.length&&p[p.length-1].blank)p.pop();if(p.length)result.push(p)};
 let col=[],h=0;
 for(let k=0;k<units.length;k++){
  const u=units[k];
  if(!col.length&&u.blank)continue; // não começa coluna com linha vazia
  if(!col.length||h+u.h<=avail){col.push(u);h+=u.h;continue}
  let cut=-1,acc=0;
  for(let j=0;j<col.length-1;j++){
   acc+=col[j].h;
   const breakHere=col[j].blank||col[j+1].sectionStart;
   if(breakHere&&acc>=avail*0.6)cut=j;
  }
  let rest=null;
  if(cut>=0){
   rest=col.slice(cut+1);
   while(rest.length&&rest[0].blank)rest.shift();
   if(sum(rest)+u.h>avail)rest=null;
  }
  if(rest){pushCol(col.slice(0,cut+1));col=rest}
  else{pushCol(col);col=[]}
  h=sum(col);
  k--; // tenta colocar o bloco atual novamente
 }
 pushCol(col);
 return result;
}

function getColsPref(){const v=db.prefs?.stageColumns;return [1,2,3,4].includes(v)?v:"auto"}
let layout={cols:1,colW:0,gap:0};

// Divide a música em páginas. Cada página pode ter várias colunas lado a lado,
// aproveitando toda a largura do notebook (como uma folha de pasta de cifras).
function paginate(){
 const lines=stageLines();
 let units=buildUnits(lines);
 const all=units.flatMap(u=>u.lines);
 const m=stageMetrics();
 const fs=current.fontSize??FONT_DEFAULT;
 const minGap=Math.max(20,Math.round(fs*1.6));

 // 1ª medição: sem quebra de linha -> largura da linha mais longa e altura total
 renderMeasure(all,0);
 const maxW=Math.ceil(sheet.getBoundingClientRect().width)+2;
 measureHeights(all,units);
 const totalH=units.reduce((t,u)=>t+u.h,0);

 // Quantas colunas cabem na largura sem quebrar as linhas da cifra
 const fit=Math.max(1,Math.min(4,Math.floor((m.w+minGap)/(maxW+minGap))));
 const pref=getColsPref();
 const cols=pref==="auto"?(totalH<=m.h?1:fit):pref;
 const colW=Math.max(60,Math.floor(Math.min(maxW,(m.w-minGap*(cols-1))/cols)));

 // 2ª medição: com a largura real da coluna
 renderMeasure(all,colW);
 measureHeights(all,units);
 sheet.style.width="";

 // Bloco maior que a altura da página (fonte muito grande) é dividido linha a linha
 units=units.flatMap(u=>u.h>m.h&&u.lines.length>1?u.lines.map(l=>({lines:[l],h:l.h,blank:l.blank})):[u]);

 const columns=packColumns(units,m.h);
 const result=[];
 for(let i=0;i<columns.length;i+=cols)result.push(columns.slice(i,i+cols));
 if(!result.length)result.push([[{lines:[{i:0,text:"",cls:"plainLine",h:0}],h:0}]]);

 const n=result.length===1?Math.max(1,result[0].length):cols;
 const gap=n>1?Math.max(minGap,Math.min((m.w-n*colW)/(n-1),minGap*4)):0;
 layout={cols:n,colW,gap:Math.floor(gap)};
 return result;
}

function pageLines(p){return p.flat().flatMap(u=>u.lines)}
function pageStartLine(){return pages[currentPage]?.[0]?.[0]?.lines?.[0]?.i??0}

function showPage(animate){
 if(!pages.length)return;
 currentPage=Math.max(0,Math.min(currentPage,pages.length-1));
 const cols=pages[currentPage].slice();
 while(cols.length<layout.cols)cols.push([]);
 sheet.className="chordSheet paged";
 sheet.style.width="";
 sheet.style.gridTemplateColumns=`repeat(${layout.cols},${layout.colW}px)`;
 sheet.style.columnGap=layout.gap+"px";
 sheet.style.setProperty("--gap",layout.gap+"px");
 sheet.innerHTML=cols.map(c=>`<div class="pageCol">${c.flatMap(u=>u.lines).map(lineHtml).join("")}</div>`).join("");
 const label=`${currentPage+1} / ${pages.length}`;
 document.getElementById("pageInfo").textContent=label;
 document.getElementById("pagePill").textContent="Pág. "+label;
 document.getElementById("prevPageBtn").disabled=currentPage<=0;
 document.getElementById("nextPageBtn").disabled=currentPage>=pages.length-1;
 updateSongButtons();
 if(animate){sheet.classList.remove("turn");void sheet.offsetWidth;sheet.classList.add("turn")}
}

// Recalcula as páginas mantendo a posição de leitura (linha keepLine)
function renderSheet(keepLine){
 if(!current)return;
 let base=NOTE_INDEX[String(current.key||"C").toUpperCase()]??0; keyPill.textContent="Tom: "+NOTES_SHARP[(base+transpose+120)%12];
 stageName.textContent=current.title;stageArtist.textContent=current.artist||"";
 stageCount.textContent=currentSetIndex>=0?`Música ${currentSetIndex+1} / ${db.setlist.length}`:"";
 document.getElementById("fontInfo").textContent=(current.fontSize??FONT_DEFAULT)+"px";
 pages=paginate();
 const pref=getColsPref();
 document.getElementById("colsBtn").textContent=pref==="auto"?`Col: Auto (${layout.cols})`:`Col: ${pref}`;
 if(keepLine!=null){
  let idx=pages.findIndex(p=>{const ls=pageLines(p);return ls.length&&ls[ls.length-1].i>=keepLine});
  currentPage=idx<0?pages.length-1:idx;
 }
 showPage(false);
}

// Alterna a quantidade de colunas: Auto -> 1 -> 2 -> 3 -> Auto (preferência geral, salva no LocalStorage)
function cycleColumns(){
 if(!current)return;
 const order=["auto",1,2,3];
 const keep=pageStartLine();
 const next=order[(order.indexOf(getColsPref())+1)%order.length];
 db.prefs=db.prefs||{};
 db.prefs.stageColumns=next;
 persist();
 renderSheet(keep);
}
// Escolhe a maior fonte possível sem aumentar o número de páginas (em relação a 16px)
function fitFont(){
 if(!current)return;
 const keep=pageStartLine();
 current.fontSize=FONT_DEFAULT;applyFont();
 const target=paginate().length;
 let best=FONT_DEFAULT;
 for(let f=FONT_MAX;f>FONT_DEFAULT;f--){
  current.fontSize=f;applyFont();
  if(paginate().length<=target){best=f;break}
 }
 current.fontSize=best;persist();applyFont();
 renderSheet(keep);
}

function nextPage(){if(!current)return;if(currentPage<pages.length-1){currentPage++;showPage(true)}}
function prevPage(){if(!current)return;if(currentPage>0){currentPage--;showPage(true)}}
function firstPage(){if(!current)return;currentPage=0;showPage(true)}
function lastPage(){if(!current)return;currentPage=pages.length-1;showPage(true)}

function applyFont(){document.documentElement.style.setProperty("--fs",(current?.fontSize??FONT_DEFAULT)+"px")}

// Carrega a música atual: página 1, tom salvo e fonte salva
function loadCurrentSong(){
 transpose=current.preferredTranspose||0;
 if(current.fontSize==null||current.fontSize===26)current.fontSize=FONT_DEFAULT;
 applyFont();
 currentPage=0;
 renderSheet(0);
 wakeControls();
}
function openStage(id){
 current=db.songs.find(s=>s.id===id);if(!current)return;
 let idx=db.setlist.indexOf(id);currentSetIndex=idx>=0?idx:-1;
 stage.classList.remove("hidden");stage.scrollTop=0;
 loadCurrentSong();
}
function exitStage(){
 clearTimeout(repaginateTimer);
 if(document.fullscreenElement)document.exitFullscreen?.();
 stage.classList.add("hidden");current=null;pages=[];currentPage=0;
}
function changeTranspose(n){if(!current)return;const keep=pageStartLine();transpose=(transpose+n+12)%12;current.preferredTranspose=transpose;persist();renderSheet(keep)}
function resetTranspose(){if(!current)return;const keep=pageStartLine();transpose=0;current.preferredTranspose=0;persist();renderSheet(keep)}
function chooseKey(){
 if(!current)return;
 let base=NOTE_INDEX[String(current.key||"C").toUpperCase()]??0;
 let desired=prompt("Digite o tom desejado (C, C#, D, D#, E, F, F#, G, G#, A, A# ou B):",NOTES_SHARP[(base+transpose)%12]);
 if(!desired)return;desired=desired.trim().toUpperCase();let idx=NOTE_INDEX[desired];if(idx===undefined)return alert("Tom inválido.");
 const keep=pageStartLine();transpose=(idx-base+12)%12;current.preferredTranspose=transpose;persist();renderSheet(keep);
}
function fontSize(d){
 if(!current)return;
 const keep=pageStartLine();
 current.fontSize=Math.max(FONT_MIN,Math.min(FONT_MAX,(current.fontSize??FONT_DEFAULT)+d));
 persist();
 applyFont();
 renderSheet(keep); // recalcula o número de páginas
}

// Navegação entre músicas do repertório (ignora itens que não existem mais na biblioteca)
function goSong(dir){
 if(!current||currentSetIndex<0)return;
 let i=currentSetIndex+dir;
 while(i>=0&&i<db.setlist.length){
  const s=db.songs.find(x=>x.id===db.setlist[i]);
  if(s){currentSetIndex=i;current=s;loadCurrentSong();return}
  i+=dir;
 }
}
function nextSong(){goSong(1)}
function previousSong(){goSong(-1)}
function updateSongButtons(){
 const inSet=currentSetIndex>=0;
 document.getElementById("previousSongBtn").disabled=!inSet||currentSetIndex<=0;
 document.getElementById("nextSongBtn").disabled=!inSet||currentSetIndex>=db.setlist.length-1;
}

function fullscreen(){if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()}
function wakeControls(){controls.classList.remove("fade");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("fade"),3500)}

// Recalcula as páginas quando a janela muda de tamanho ou entra/sai da tela cheia
function scheduleRepaginate(){
 if(!current||stage.classList.contains("hidden"))return;
 clearTimeout(repaginateTimer);
 const keep=pageStartLine();
 repaginateTimer=setTimeout(()=>{if(current)renderSheet(keep)},120);
}
window.addEventListener("resize",scheduleRepaginate);
document.addEventListener("fullscreenchange",scheduleRepaginate);

// Evita que o botão clicado fique com foco (senão Espaço/Enter o acionariam de novo)
stage.addEventListener("click",e=>{const b=e.target.closest("button");if(b)b.blur()});

function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="setcifra-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.songs))throw 0;db=x;db.setlist=db.setlist||[];db.prefs=db.prefs||{font:18,speed:.65};persist();render();alert("Backup importado.");}catch{alert("Arquivo de backup inválido.")}};r.readAsText(f);e.target.value=""}


function cleanPastedChord(raw){
 let s=String(raw||"");
 // Normalize copied browser whitespace and markdown-like bold markers.
 s=s.replace(/\u00A0/g," ").replace(/\u2007|\u202F/g," ");
 s=s.replace(/\*\*(.*?)\*\*/g,"$1");
 s=s.replace(/__([^_]+)__/g,"$1");
 s=s.replace(/\r\n?/g,"\n");
 // Remove trailing whitespace but preserve leading spaces used for chord positioning.
 s=s.split("\n").map(line=>line.replace(/[ \t]+$/g,"")).join("\n");
 // Avoid huge empty gaps.
 s=s.replace(/\n{4,}/g,"\n\n\n");
 return s.trim();
}
function extractDeclaredKey(text){
 const m=String(text).match(/(?:^|\n)\s*Tom\s*:\s*([A-G](?:#|b)?)/i);
 return m?normalizeDetectedKey(m[1]):null;
}
function normalizeDetectedKey(k){
 const idx=NOTE_INDEX[String(k).toUpperCase()];
 return idx===undefined?null:NOTES_SHARP[idx];
}
function processPastedChord(){
 const before=content.value;
 const cleaned=cleanPastedChord(before);
 content.value=cleaned;
 const detected=extractDeclaredKey(cleaned);
 if(detected){key.value=detected;processInfo.textContent="Tom detectado: "+detected;}
 else processInfo.textContent="Cifra organizada. Confira o tom antes de salvar.";
}

/* Atalhos do Modo Palco
   PageDown / ↓ / Espaço = próxima página
   PageUp / ↑ / Shift+Espaço = página anterior
   → = próxima música | ← = música anterior
   F = tela cheia | R ou Home = página 1 | End = última página | C = colunas
   + / - = transpor | 0 = tom original */
document.addEventListener("keydown",e=>{
 if(stage.classList.contains("hidden")||["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==="PageDown"||k==="ArrowDown"||(k===" "&&!e.shiftKey)){e.preventDefault();nextPage()}
 else if(k==="PageUp"||k==="ArrowUp"||(k===" "&&e.shiftKey)){e.preventDefault();prevPage()}
 else if(k==="ArrowRight"){e.preventDefault();nextSong()}
 else if(k==="ArrowLeft"){e.preventDefault();previousSong()}
 else if(k==="Home"){e.preventDefault();firstPage()}
 else if(k==="End"){e.preventDefault();lastPage()}
 else if(k==="+")changeTranspose(1);
 else if(k==="-")changeTranspose(-1);
 else if(k==="0")resetTranspose();
 else if(k.toLowerCase()==="f"){e.preventDefault();fullscreen()}
 else if(k.toLowerCase()==="r"){e.preventDefault();firstPage()}
 else if(k.toLowerCase()==="c"){e.preventDefault();cycleColumns()}
});
if(!db.songs.length){
 db.songs=[
 {id:uid(),title:"Canção de Exemplo",artist:"Demonstração",key:"G",duration:"03:20",preferredTranspose:0,content:`G              D
Esta é uma linha de demonstração
Em             C
Use sua própria letra autorizada aqui

G              D
As páginas acompanham sua apresentação
Em              C
E o tom pode mudar sem alterar a letra`},
 {id:uid(),title:"Teste de Transposição",artist:"SetCifra",key:"C",duration:"02:50",preferredTranspose:0,content:`C       G/B       Am
Linha para testar os acordes
F       C/E       Dm7   G7
Incluindo inversões e extensões

Cmaj7   Am7       Dm7   G7
Experimente os botões de tom`}
 ];persist();
}
render();
</script>
